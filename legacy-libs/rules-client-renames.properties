# Rules for the DAF rules client: its own execution, so the jakarta renames it needs are listed here too.
# Jersey 2 shaded Guava into jersey.repackaged; Jersey 4 does not, so the client uses Guava itself.
jersey.repackaged.com.google.common.base=com.google.common.base
jersey.repackaged.com.google.common.collect=com.google.common.collect
javax.inject=jakarta.inject
javax.ws.rs=jakarta.ws.rs
javax.ws.rs.client=jakarta.ws.rs.client
javax.ws.rs.core=jakarta.ws.rs.core
javax.ws.rs.ext=jakarta.ws.rs.ext
